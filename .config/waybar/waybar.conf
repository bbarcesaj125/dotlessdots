{
    // ╭──────────────────────────────────────────────────────────────╮
    // │                          WAYBAR                              │
    // ╰──────────────────────────────────────────────────────────────╯

    "layer": "top",
    "height": 26,
    "spacing": 2,

    "modules-left": [
        "niri/workspaces",
         "niri/window"
    ],

    "modules-center": [
        "custom/weather",
        "clock"
    ],

    "modules-right": [
        "network",
        "custom/disk_combined",
        "pulseaudio",
        "cpu",
        "memory",
        "temperature",
        "battery",
        "battery#bat2",
        "tray",
        "idle_inhibitor"
    ],


    // ╭──────────────────────────────────────────────────────────────╮
    // │                         WORKSPACES                           │
    // ╰──────────────────────────────────────────────────────────────╯

    "niri/workspaces": {
    "format": "{icon}",
    "format-icons": {
        "active": "●",
        "default": "○"
    }
    },

    // ╭──────────────────────────────────────────────────────────────╮
    // │                           WEATHER                            │
    // ╰──────────────────────────────────────────────────────────────╯

    "custom/weather": {
        "exec": "waybar-weather Toulouse",
        "return-type": "json",
        "format": "{}",
        "tooltip": true,
        "interval": 3600,
        "max-length": 15,
        "min-length": 8
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                            SYSTEM                            │
    // ╰──────────────────────────────────────────────────────────────╯

    "cpu": {
        "format": "{usage}% ",
        "tooltip": false
    },

    "memory": {
        "format": "{}% "
    },

    "temperature": {
        "critical-threshold": 80,
        "format": "{temperatureC}°C {icon}",
        "format-icons": [
            "",
            "",
            ""
        ]
    },

    "custom/disk_combined": {
        "exec": "waybar-disk",
        "return-type": "json",
        "interval": 60,
        "format": "{}",
        "tooltip": true
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                           NETWORK                            │
    // ╰──────────────────────────────────────────────────────────────╯

    "network": {
    "interval": 1,
    "format-wifi": "<span color='#66D9EF'></span> {bandwidthDownBytes} <span color='#A6E22E'></span> {bandwidthUpBytes}",
    "format-ethernet": "<span color='#66D9EF'></span> {bandwidthDownBytes} <span color='#A6E22E'></span> {bandwidthUpBytes}",
    "format-linked": " {ifname} (No IP)",
    "format-disconnected": "⚠ Disconnected",
    "format-alt": "{ifname}: {ipaddr}/{cidr}"
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                            AUDIO                             │
    // ╰──────────────────────────────────────────────────────────────╯

    "pulseaudio": {
        "format": "{volume}% {icon}",
        "format-bluetooth": "{volume}% {icon}",
        "format-bluetooth-muted": " {icon}",
        "format-muted": "",
        "format-icons": {
            "headphone": "",
            "hands-free": "",
            "headset": "",
            "phone": "",
            "portable": "",
            "car": "",
            "default": [
                "",
                "",
                ""
            ]
        },
        "on-click": "pavucontrol"
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                           BATTERY                            │
    // ╰──────────────────────────────────────────────────────────────╯

    "battery": {
        "states": {
            "warning": 30,
            "critical": 15
        },
        "format": "{capacity}% {icon}",
        "format-charging": "{capacity}% ",
        "format-plugged": "{capacity}% ",
        "format-alt": "{time} {icon}",
        "format-icons": [
            "",
            "",
            "",
            "",
            ""
        ]
    },

    "battery#bat2": {
        "bat": "BAT2"
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                       POWER MANAGEMENT                       │
    // ╰──────────────────────────────────────────────────────────────╯

    "idle_inhibitor": {
        "format": "{icon}",
        "format-icons": {
            "activated": "",
            "deactivated": ""
        },
        "tooltip": true,
        "tooltip-format-activated": "Idle Inhibitor: Active (Stay Awake)",
        "tooltip-format-deactivated": "Idle Inhibitor: Inactive (Normal)"
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                            CLOCK                             │
    // ╰──────────────────────────────────────────────────────────────╯

    "clock": {
        "tooltip-format": "<big>{:%Y %B}</big>\n<tt><small>{calendar}</small></tt>",
        "format-alt": "{:%Y-%m-%d}"
    },


    // ╭──────────────────────────────────────────────────────────────╮
    // │                             TRAY                             │
    // ╰──────────────────────────────────────────────────────────────╯

    "tray": {
        "spacing": 10
    }
}